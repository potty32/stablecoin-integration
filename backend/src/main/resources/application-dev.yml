spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stablecoin_dev
    username: stablecoin_app
    password: stablecoin_app_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 3000
  flyway:
    url: jdbc:postgresql://localhost:5432/stablecoin_dev
    user: stablecoin
    password: stablecoin_dev_pass
  jpa:
    show-sql: false

logging:
  level:
    de.atruvia.stablecoin: DEBUG
    org.springframework.security: DEBUG

app:
  security:
    jwt-secret: dev-secret-key-minimum-256-bits-for-hs256-algorithm-placeholder
    jwt-expiration-ms: 86400000
    dev-mode: true

resilience4j:
  retry:
    instances:
      circle-wallet:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.lang.RuntimeException
        ignore-exceptions:
          - de.atruvia.stablecoin.exception.ComplianceBlockException
          - de.atruvia.stablecoin.exception.TaurusLimitExceededException
          - java.lang.IllegalStateException  # Fallback wirft IllegalStateException → nicht erneut versuchen
      taurus-custody:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.lang.RuntimeException
        ignore-exceptions:
          - de.atruvia.stablecoin.exception.TaurusLimitExceededException
          - java.lang.IllegalStateException  # Fallback wirft IllegalStateException → nicht erneut versuchen
      core-banking:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.lang.RuntimeException
  circuitbreaker:
    instances:
      circle-wallet:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      taurus-custody:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      core-banking:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      chainalysis:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        ignore-exceptions:
          - de.atruvia.stablecoin.exception.ComplianceBlockException
