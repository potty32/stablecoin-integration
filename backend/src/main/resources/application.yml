spring:
  application:
    name: stablecoin-platform
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:}
  revenue:
    fx-spread: 0.0015
    fee-b2b: 2.50
    fee-b2c: 0.50
    gas-cost-simulated: 0.008
  taurus:
    single-tx-limit: 1000000.00
  rate-quote:
    validity-seconds: 60
  compliance:
    high-risk-address: "0xHighRiskAddress000000000000000000000000"
