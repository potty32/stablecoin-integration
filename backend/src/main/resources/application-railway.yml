spring:
  config:
    activate:
      on-profile: railway

  # Railway stellt DATABASE_URL als postgresql://user:pass@host:port/db bereit.
  # jdbc:-Prefix wird ergänzt damit der PostgreSQL-JDBC-Treiber die URL erkennt.
  datasource:
    url: "jdbc:${DATABASE_URL}"
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  # TenantDataSourceConfig.adminDataSource liest spring.flyway.url/user/password
  # via @Value — auf Railway identisch mit der App-DataSource (Railway hat einen User,
  # der automatisch Table-Owner ist und RLS bypassed).
  flyway:
    url: "jdbc:${DATABASE_URL}"
    user: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    schemas: public

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.flywaydb: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.engine.jdbc.env: DEBUG

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
