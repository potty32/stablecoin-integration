spring:
  config:
    activate:
      on-profile: railway

  # DATABASE_URL von Railway: postgresql://user:pass@host:port/db (ggf. ?sslmode=require)
  # jdbc:-Prefix macht daraus eine gültige JDBC-URL für den PostgreSQL-Treiber.
  datasource:
    url: "jdbc:${DATABASE_URL}"
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    schemas: public
    # Kein spring.flyway.url → Flyway nutzt die primäre DataSource (HikariCP).
    # HikariCP loggt den echten Verbindungsfehler (statt Flyway's null-Connection-Bug).

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.flywaydb: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.engine.jdbc.env: DEBUG

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
