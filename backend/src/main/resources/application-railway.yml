spring:
  config:
    activate:
      on-profile: railway

  # DATABASE_URL ist auf Railway bereits eine vollständige JDBC-URL (jdbc:postgresql://...)
  datasource:
    url: "${DATABASE_URL}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    # Erbt DataSource von oben — keine eigene URL nötig, vermeidet doppelte Konfiguration
    schemas: public

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    de.atruvia.stablecoin: INFO

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
