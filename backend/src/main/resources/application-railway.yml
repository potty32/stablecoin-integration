spring:
  config:
    activate:
      on-profile: railway

  # Credentials NICHT in der URL einbetten — PostgreSQL JDBC 42.7.x parst user:pass@host
  # nicht korrekt und behandelt den gesamten Ausdruck als Hostnamen (UnknownHostException).
  # Stattdessen: URL nur mit Host/Port/DB, Credentials separat via username/password.
  datasource:
    url: "jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}"
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    # Überschreibt dev-Profil (localhost) — @FlywayDataSource Bean nutzt SimpleDriverDataSource
    url: "jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}"
    user: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    schemas: public

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    de.atruvia.stablecoin: INFO
    org.flywaydb.core.internal.command: INFO

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
