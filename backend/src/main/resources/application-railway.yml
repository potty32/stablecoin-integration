spring:
  config:
    activate:
      on-profile: railway

  # Railway stellt DATABASE_URL bereit: postgresql://user:pass@host:port/db
  # jdbc: Prefix hinzufügen → HikariCP liest User/Pass automatisch aus der URL
  datasource:
    url: "jdbc:${DATABASE_URL}?sslmode=require"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    url: "jdbc:${DATABASE_URL}?sslmode=require"
    # User/Password werden von Flyway aus der URL gelesen (kein separates Feld nötig)

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    de.atruvia.stablecoin: INFO

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
