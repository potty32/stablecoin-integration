spring:
  config:
    activate:
      on-profile: railway

  # DATABASE_URL von Railway: postgresql://user:pass@host:port/db (ggf. ?sslmode=require)
  # jdbc:-Prefix macht daraus eine gültige JDBC-URL für den PostgreSQL-Treiber.
  datasource:
    url: "jdbc:${DATABASE_URL}"
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    # Überschreibt dev-Profil (localhost) — @FlywayDataSource Bean nutzt SimpleDriverDataSource
    url: "jdbc:${DATABASE_URL}"
    user: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    schemas: public

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    de.atruvia.stablecoin: INFO
    org.flywaydb.core.internal.command: INFO

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
