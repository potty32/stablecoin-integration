spring:
  config:
    activate:
      on-profile: railway

  # Explizite URL aus PG*-Variablen — vermeidet Formatprobleme mit DATABASE_URL
  # (Railway setzt DATABASE_URL teils als postgres://, teils als postgresql://).
  # ?sslmode=require: Railway-PostgreSQL erfordert TLS für interne Verbindungen.
  datasource:
    url: "jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require"
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  flyway:
    url: "jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require"
    user: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    schemas: public

  jpa:
    show-sql: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.zaxxer.hikari: DEBUG
    org.flywaydb: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.engine.jdbc.env: DEBUG

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: 86400000
    dev-mode: true
    phone-hmac-key: ${PHONE_HMAC_KEY:railway-phone-hmac-placeholder-32-bytes-ok}
  webhook:
    circle-secret: ${CIRCLE_WEBHOOK_SECRET:railway-webhook-placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
