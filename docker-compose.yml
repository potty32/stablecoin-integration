version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stablecoin_dev
      POSTGRES_USER: stablecoin
      POSTGRES_PASSWORD: stablecoin_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./testdata/init_postgres.sql:/docker-entrypoint-initdb.d/01_create_app_user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stablecoin -d stablecoin_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
