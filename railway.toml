[[services]]
name = "stablecoin-backend"
source = "backend"

[services.build]
buildCommand = "mvn clean package -DskipTests"
startCommand = "java -jar target/stablecoin-backend-1.0.0.jar"
# Maven-Build inkl. Abhängigkeiten: 10 Minuten Timeout
buildTimeout = 600

[services.deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 60
# Zero-Downtime: Railway wartet auf /actuator/health=UP bevor Traffic umgeleitet wird
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Pflicht-Umgebungsvariablen (in Railway Dashboard setzen):
# DATABASE_URL         — jdbc:postgresql://<host>:5432/stablecoin
# DATABASE_USERNAME    — DB-Benutzername
# DATABASE_PASSWORD    — DB-Passwort
# JWT_SECRET           — HS256-Schlüssel (mind. 32 Zeichen)
# CIRCLE_API_KEY       — Circle API Key
# CIRCLE_MASTER_WALLET_ID — Circle Wallet UUID
# TAURUS_API_KEY       — Taurus Custody API Key
# TAURUS_BASE_URL      — Taurus API Basis-URL
# CHAINALYSIS_API_KEY  — Chainalysis API Key
# CORE_BANKING_BASE_URL — Kernbank-API-URL
# CORE_BANKING_API_KEY — Kernbank-API-Key
# N8N_WEBHOOK_URL      — n8n Settlement-Webhook-URL
# Vollständige Liste: siehe .env.example

[[services]]
name = "stablecoin-frontend"
source = "frontend"

[services.build]
buildCommand = "npm ci && npm run build"
startCommand = "npx serve dist/stablecoin-frontend -l $PORT --single"
buildTimeout = 300
