# ═══════════════════════════════════════════════════════════════════════════
# Railway Deployment — Single-Container (Angular + Spring Boot)
# Ziel: max. 10 parallele Demo-User, minimale Kosten
# ═══════════════════════════════════════════════════════════════════════════

[build]
builder         = "DOCKERFILE"
dockerfilePath  = "Dockerfile"

[deploy]
# startCommand absichtlich weggelassen: Dockerfile-ENTRYPOINT wird verwendet.
# "sh -c 'java $JAVA_OPTS -jar app.jar'" expandiert $JAVA_OPTS korrekt.
healthcheckPath         = "/actuator/health"
healthcheckTimeout      = 120
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── Pflicht-Umgebungsvariablen (Railway Dashboard → Variables) ─────────────
# SPRING_PROFILES_ACTIVE  = railway
# PGHOST     → Reference auf Railway PostgreSQL Plugin
# PGPORT     → Reference auf Railway PostgreSQL Plugin
# PGDATABASE → Reference auf Railway PostgreSQL Plugin
# PGUSER     → Reference auf Railway PostgreSQL Plugin
# PGPASSWORD → Reference auf Railway PostgreSQL Plugin
# JWT_SECRET → min. 32 Zeichen (beliebig, für HS256-Signing)
# PORT       = 8080
